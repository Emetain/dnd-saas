<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" preserveAspectRatio="xMidYMid slice">
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#0b1630"/>
      <stop offset="0.55" stop-color="#1c3a8a"/>
      <stop offset="1" stop-color="#b3475a"/>
    </linearGradient>
    <radialGradient id="moon-glow" r="50%">
      <stop offset="0" stop-color="#fff3d6" stop-opacity="0.55"/>
      <stop offset="1" stop-color="#fff3d6" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <rect width="1600" height="900" fill="url(#sky)"/>

  <!-- Stars -->
  <g fill="#ffffff">
    <circle cx="120" cy="80" r="2"/><circle cx="260" cy="150" r="1.5"/><circle cx="420" cy="60" r="2.5"/><circle cx="560" cy="130" r="1.5"/>
    <circle cx="700" cy="50" r="2"/><circle cx="820" cy="170" r="1.5"/><circle cx="1500" cy="70" r="2"/><circle cx="1560" cy="200" r="1.5"/>
    <circle cx="80" cy="260" r="1.5"/><circle cx="360" cy="240" r="2"/><circle cx="640" cy="260" r="1.2"/><circle cx="1480" cy="300" r="1.5"/>
  </g>

  <!-- Moon -->
  <circle cx="1180" cy="210" r="260" fill="url(#moon-glow)"/>
  <circle cx="1180" cy="210" r="110" fill="#fff0cf"/>
  <circle cx="1145" cy="185" r="18" fill="#ecd9ae"/><circle cx="1215" cy="245" r="12" fill="#ecd9ae"/>

  <!-- Dragon silhouette crossing the moon -->
  <g fill="#0a1024" transform="translate(1110 205) rotate(-8)">
    <path d="M-150 10 C-100 -20 -40 -10 0 0 C40 -10 90 -8 130 -30 C150 -40 170 -35 180 -20 C165 -18 150 -10 140 0 C120 10 60 20 20 22 C-20 26 -80 30 -150 10 Z"/>
    <path d="M-30 0 C-60 -90 -130 -130 -210 -120 C-160 -100 -120 -70 -110 -40 C-150 -60 -190 -55 -220 -40 C-170 -30 -120 -10 -60 8 Z"/>
    <path d="M40 2 C70 -70 140 -110 230 -110 C180 -85 150 -60 140 -30 C180 -45 220 -40 250 -25 C200 -12 140 5 70 14 Z"/>
    <path d="M-150 10 C-190 20 -230 40 -270 30 C-240 20 -215 10 -190 -2 Z"/>
  </g>

  <!-- Far mountains -->
  <path d="M0 620 L180 470 L320 580 L480 430 L660 600 L820 480 L1000 610 L1180 470 L1380 590 L1600 460 V900 H0 Z" fill="#26356a"/>
  <!-- Castle on the cliff -->
  <g fill="#131c3d">
    <path d="M0 900 V700 C220 660 380 690 520 640 L700 620 L760 700 V900 Z"/>
    <rect x="430" y="470" width="60" height="190"/><path d="M420 470 h80 l-40 -60 z"/>
    <rect x="520" y="520" width="120" height="130"/>
    <rect x="600" y="430" width="50" height="220"/><path d="M592 430 h66 l-33 -55 z"/>
    <rect x="380" y="540" width="60" height="120"/><path d="M372 540 h76 l-38 -45 z"/>
    <g><rect x="520" y="505" width="18" height="18"/><rect x="552" y="505" width="18" height="18"/><rect x="584" y="505" width="18" height="18"/></g>
  </g>
  <g fill="#ffcf7a">
    <rect x="452" y="520" width="12" height="20" rx="6"/><rect x="620" y="480" width="10" height="18" rx="5"/><rect x="560" y="570" width="14" height="22" rx="7"/>
  </g>
  <path d="M625 375 V330 l30 10 l-30 10" fill="#e5484d" stroke="#131c3d" stroke-width="3"/>

  <!-- Near hills with a road to the castle -->
  <path d="M600 900 C800 760 1100 740 1600 780 V900 Z" fill="#0d142e"/>
  <path d="M1400 900 C1200 820 980 800 760 700" fill="none" stroke="#3a4a86" stroke-width="10" stroke-dasharray="2 18" stroke-linecap="round"/>
</svg>
