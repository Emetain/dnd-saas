spring:
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/dndsaas}
    driver-class-name: org.postgresql.Driver
    username: ${DB_USERNAME:dndsaas}
    password: ${DB_PASSWORD:changeme}
  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        format_sql: true

