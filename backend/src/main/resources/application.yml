spring:
  application:
    name: dnd-saas
  profiles:
    active: dev

server:
  port: 8080
  servlet:
    context-path: /api

# API documentation (springdoc-openapi / Swagger UI)
springdoc:
  swagger-ui:
    path: /swagger-ui.html
    operationsSorter: alpha
    tagsSorter: alpha
    display-request-duration: true
  api-docs:
    path: /v3/api-docs

# AI provider configuration.
# The key is NEVER stored here — it is read from the OPENAI_API_KEY environment
# variable so it can never be committed to the repository.
app:
  openai:
    api-key: ${OPENAI_API_KEY:}
    base-url: https://api.openai.com/v1
    model: gpt-4o-mini
    timeout-seconds: 60
  # Payments. Without STRIPE_SECRET_KEY, payments are off and plan changes are free (testing).
  stripe:
    secret-key: ${STRIPE_SECRET_KEY:}
    webhook-secret: ${STRIPE_WEBHOOK_SECRET:}
    return-base-url: ${APP_BASE_URL:http://localhost:5173}

