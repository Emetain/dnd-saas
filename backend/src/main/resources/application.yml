spring:
  application:
    name: dnd-saas
  profiles:
    active: dev

server:
  port: 8080
  servlet:
    context-path: /api

# API documentation (springdoc-openapi / Swagger UI)
springdoc:
  swagger-ui:
    path: /swagger-ui.html
    operationsSorter: alpha
    tagsSorter: alpha
    display-request-duration: true
  api-docs:
    path: /v3/api-docs

---
# Development profile: in-memory H2 database
spring:
  config:
    activate:
      on-profile: dev
  datasource:
    url: jdbc:h2:mem:dndsaas;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
    driver-class-name: org.h2.Driver
    username: sa
    password: ""
  jpa:
    hibernate:
      ddl-auto: create-drop
    show-sql: true
    properties:
      hibernate:
        format_sql: true
  h2:
    console:
      enabled: true
      path: /h2-console

---
# Local PostgreSQL running via docker-compose.
# Activate with: -Dspring.profiles.active=postgres  (or SPRING_PROFILES_ACTIVE=postgres)
# Data survives restarts, unlike the in-memory H2 dev profile.
spring:
  config:
    activate:
      on-profile: postgres
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/dndsaas}
    driver-class-name: org.postgresql.Driver
    username: ${DB_USERNAME:dndsaas}
    password: ${DB_PASSWORD:dndsaas}
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        format_sql: true

---
# The backend running inside docker-compose (talks to the "postgres" service).
spring:
  config:
    activate:
      on-profile: docker
  datasource:
    url: ${DB_URL:jdbc:postgresql://postgres:5432/dndsaas}
    driver-class-name: org.postgresql.Driver
    username: ${DB_USERNAME:dndsaas}
    password: ${DB_PASSWORD:dndsaas}
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: false

---
# Production profile: PostgreSQL (configure via environment variables)
spring:
  config:
    activate:
      on-profile: prod
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/dndsaas}
    driver-class-name: org.postgresql.Driver
    username: ${DB_USERNAME:dndsaas}
    password: ${DB_PASSWORD:changeme}
  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: false
