services:
  postgres:
    image: postgres:16-alpine
    container_name: dndsaas-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-dndsaas}
      POSTGRES_USER: ${POSTGRES_USER:-dndsaas}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-dndsaas}
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-dndsaas} -d ${POSTGRES_DB:-dndsaas}"]
      interval: 5s
      timeout: 5s
      retries: 10

  # Lightweight web UI for browsing the database at http://localhost:8081
  adminer:
    image: adminer:latest
    container_name: dndsaas-adminer
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    ports:
      - "8081:8080"
    environment:
      ADMINER_DEFAULT_SERVER: postgres
      ADMINER_DESIGN: dracula

  # Catches every email the app sends (account verification, password resets).
  # Read them at http://localhost:8025 — nothing is delivered to real inboxes.
  mailpit:
    image: axllent/mailpit:latest
    container_name: dndsaas-mailpit
    restart: unless-stopped
    ports:
      - "8025:8025"   # web inbox
      - "1025:1025"   # SMTP

  # The Spring Boot backend. Only started with the "full" profile:
  #   docker compose --profile full up
  # For day-to-day development, run the backend from IntelliJ instead and use
  # only the postgres + adminer containers.
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: dndsaas-backend
    restart: unless-stopped
    profiles: ["full"]
    depends_on:
      postgres:
        condition: service_healthy
    ports:
      - "8080:8080"
    environment:
      SPRING_PROFILES_ACTIVE: docker
      DB_URL: jdbc:postgresql://postgres:5432/${POSTGRES_DB:-dndsaas}
      DB_USERNAME: ${POSTGRES_USER:-dndsaas}
      DB_PASSWORD: ${POSTGRES_PASSWORD:-dndsaas}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      STRIPE_SECRET_KEY: ${STRIPE_SECRET_KEY:-}
      STRIPE_WEBHOOK_SECRET: ${STRIPE_WEBHOOK_SECRET:-}
      APP_BASE_URL: ${APP_BASE_URL:-http://localhost:5173}
      MAIL_HOST: ${MAIL_HOST:-mailpit}
      MAIL_PORT: ${MAIL_PORT:-1025}

  # Forwards Stripe test-mode webhooks to the backend container, so no Stripe CLI
  # install or `stripe login` is needed. Only started with the "full" profile.
  # Its webhook signing secret (put it in .env as STRIPE_WEBHOOK_SECRET):
  #   docker compose run --rm stripe-cli listen --print-secret
  stripe-cli:
    image: stripe/stripe-cli:latest
    container_name: dndsaas-stripe-cli
    restart: unless-stopped
    profiles: ["full"]
    depends_on:
      - backend
    environment:
      STRIPE_API_KEY: ${STRIPE_SECRET_KEY:-}
    # The events StripeService.handleWebhook reacts to.
    command: >-
      listen --forward-to http://backend:8080/api/v1/stripe/webhook
      --events checkout.session.completed,customer.subscription.created,customer.subscription.updated,customer.subscription.deleted,invoice.paid

volumes:
  postgres-data:

